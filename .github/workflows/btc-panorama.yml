name: BTC 24h minute panorama
on:
  workflow_dispatch:
  push:
    branches: [feature/trap-signals-v14]
    paths: ['.github/workflows/btc-panorama.yml']
permissions:
  contents: read
jobs:
  panorama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: annual-replay.csv
          key: btc-annual-replay-compact-20251010-20261023-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install matplotlib numpy
      - run: |
          python3 - <<'PY'
          import csv, datetime
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.collections import LineCollection
          from matplotlib.patches import Rectangle
          day=datetime.datetime(2026,8,17,tzinfo=datetime.timezone.utc)
          start=int(day.timestamp()*1000)
          rows=[(int(r[0]),*map(float,r[1:6])) for r in csv.reader(open('annual-replay.csv')) if start<=int(r[0])<start+86400000]
          assert [r[0] for r in rows]==list(range(start,start+86400000,60000))
          from pathlib import Path
          out=Path('charts');out.mkdir(exist_ok=True)
          def draw(seg,name,width,height,offset):
              fig,ax=plt.subplots(figsize=(width,height),dpi=100)
              colors=['#20b486' if c>=o else '#e05260' for _,o,h,l,c,v in seg]
              ax.add_collection(LineCollection([[(i,l),(i,h)] for i,(_,o,h,l,c,v) in enumerate(seg)],colors=colors,linewidths=1))
              for i,(_,o,h,l,c,v) in enumerate(seg):
                  ax.add_patch(Rectangle((i-.38,min(o,c)),.76,abs(c-o) or .01,color=colors[i],linewidth=0))
              ax.autoscale_view()
              ax.set_xlim(-1,len(seg))
              step=30 if len(seg)>60 else 5
              ticks=list(range(0,len(seg),step))
              ax.set_xticks(ticks,[f'{(i+offset)//60:02d}:{(i+offset)%60:02d}' for i in ticks])
              ax.set_facecolor('#111927');fig.patch.set_facecolor('#111927')
              ax.tick_params(colors='white',labelsize=12);ax.grid(alpha=.2);ax.set_axisbelow(True)
              ax.set_title(f'BTCUSDT | Bybit | 2026-08-17 UTC | {name} | 1m',color='white',fontsize=20)
              fig.subplots_adjust(left=.008 if len(seg)>60 else .08,right=.995,bottom=.06,top=.95)
              fig.savefig(out/(name+'.png'),dpi=100)
              plt.close(fig)
          import numpy as np
          p=np.array([r[4] for r in rows])
          methods={}
          for mode in ('efficiency','impulse','regression'):
              cand=[]
              for i in range(20,len(p)-20):
                  for w in (5,10,20):
                      z=p[i-w:i+w+1]; d=z[-1]-z[0]; s=1 if d>0 else -1
                      e=abs(d)/(np.abs(np.diff(z)).sum()+1e-9)
                      noise=np.median(np.abs(np.diff(p[max(0,i-60):min(len(p),i+61)])))+1e-9
                      strength=abs(d)/(noise*np.sqrt(2*w))
                      corr=abs(np.corrcoef(np.arange(len(z)),z)[0,1]) if np.std(z)>0 else 0
                      score={'efficiency':e,'impulse':strength,'regression':corr}[mode]
                      if score >= {'efficiency':.5,'impulse':3,'regression':.85}[mode] and strength>=2:
                          cand.append((score,i,s,w))
              waves=[]
              for score,i,s,w in sorted(cand,reverse=True):
                  if any(a<=i<=b for a,b,*_ in waves):continue
                  left=max(0,i-w*2);right=min(len(p),i+w*2+1)
                  a=left+int(np.argmin(s*p[left:i+1]))
                  b=i+int(np.argmax(s*p[i:right]))
                  if b-a<5 or any(a<=v and b>=u for u,v,*_ in waves):continue
                  waves.append((a,b,i,s,float(score)))
              methods[mode]=sorted(waves)
              print('METHOD',mode,'COUNT',len(waves))
              for h in range(0,24,4):
                  lo=h*60;hi=lo+240
                  fig,ax=plt.subplots(figsize=(18,7),dpi=120)
                  seg=rows[lo:hi]
                  for k,(_,o,high,low,c,v) in enumerate(seg,lo):
                      color='#20b486' if c>=o else '#e05260'
                      ax.vlines(k,low,high,color=color,linewidth=.7)
                      ax.add_patch(Rectangle((k-.35,min(o,c)),.7,max(abs(c-o),.01),color=color))
                  for a,b,i,s,score in waves:
                      if b<lo or a>=hi:continue
                      color='#20b486' if s>0 else '#e05260'
                      ax.axvspan(a,b,color=color,alpha=.15)
                      ax.plot([a,b],[p[a],p[b]],color=color,linewidth=2)
                      ax.scatter(i,p[i],color='gold',s=35,zorder=5)
                  ax.set_xlim(lo-1,hi);ax.set_xticks(range(lo,hi,15),[f'{k//60:02d}:{k%60:02d}' for k in range(lo,hi,15)])
                  ax.set_title(f'{mode} | BTCUSDT 1m | 2026-08-17 UTC');ax.grid(alpha=.15)
                  fig.tight_layout();fig.savefig(out/f'{mode}-{h:02d}.png');plt.close(fig)
          import json
          (out/'comparison.json').write_text(json.dumps(methods))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-method-comparison
          path: charts/
