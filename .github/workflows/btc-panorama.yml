name: BTC 24h minute panorama
on:
  workflow_dispatch:
  push:
    branches: [feature/trap-signals-v14]
    paths: ['.github/workflows/btc-panorama.yml']
permissions:
  contents: read
jobs:
  panorama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: annual-replay.csv
          key: btc-annual-replay-compact-20251010-20261023-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install matplotlib
      - run: |
          python3 - <<'PY'
          import csv, datetime
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.collections import LineCollection
          from matplotlib.patches import Rectangle
          day=datetime.datetime(2026,8,17,tzinfo=datetime.timezone.utc)
          start=int(day.timestamp()*1000)
          rows=[(int(r[0]),*map(float,r[1:6])) for r in csv.reader(open('annual-replay.csv')) if start<=int(r[0])<start+86400000]
          assert [r[0] for r in rows]==list(range(start,start+86400000,60000))
          from pathlib import Path
          out=Path('charts');out.mkdir(exist_ok=True)
          def draw(seg,name,width,height,offset):
              fig,ax=plt.subplots(figsize=(width,height),dpi=100)
              colors=['#20b486' if c>=o else '#e05260' for _,o,h,l,c,v in seg]
              ax.add_collection(LineCollection([[(i,l),(i,h)] for i,(_,o,h,l,c,v) in enumerate(seg)],colors=colors,linewidths=1))
              for i,(_,o,h,l,c,v) in enumerate(seg):
                  ax.add_patch(Rectangle((i-.38,min(o,c)),.76,abs(c-o) or .01,color=colors[i],linewidth=0))
              ax.autoscale_view()
              ax.set_xlim(-1,len(seg))
              step=30 if len(seg)>60 else 5
              ticks=list(range(0,len(seg),step))
              ax.set_xticks(ticks,[f'{(i+offset)//60:02d}:{(i+offset)%60:02d}' for i in ticks])
              ax.set_facecolor('#111927');fig.patch.set_facecolor('#111927')
              ax.tick_params(colors='white',labelsize=12);ax.grid(alpha=.2);ax.set_axisbelow(True)
              ax.set_title(f'BTCUSDT | Bybit | 2026-08-17 UTC | {name} | 1m',color='white',fontsize=20)
              fig.subplots_adjust(left=.008 if len(seg)>60 else .08,right=.995,bottom=.06,top=.95)
              fig.savefig(out/(name+'.png'),dpi=100)
              plt.close(fig)
          draw(rows,'btc-24h',144,40,0)
          for h in range(24):
              draw(rows[h*60:(h+1)*60],f'btc-hour-{h:02d}',16,10,h*60)
          import json
          closes=[r[4] for r in rows]
          travel=[0.]
          for i in range(1,len(closes)):travel.append(travel[-1]+abs(closes[i]-closes[i-1]))
          def efficiency(a,b):
              d=travel[b]-travel[a]
              return (closes[b]-closes[a])/d if d else 0.
          candidates=[]
          for i in range(40,len(rows)-40):
              scores=[efficiency(i-w//2,i+w-w//2) for w in (5,10,20,40,80)]
              for sign in (1,-1):
                  strong=[v*sign for v in scores if v*sign>=.7]
                  if len(strong)>=3:candidates.append((sum(strong)/len(strong),i,sign))
          waves=[]
          for score,i,sign in sorted(candidates,reverse=True):
              if any(a<=i<=b for a,b,_,_,_ in waves):continue
              a,b=i-2,i+3
              if efficiency(a,b)*sign<.45:continue
              while a>0 and efficiency(a-1,b)*sign>=.45:a-=1
              while b<len(rows)-1 and efficiency(a,b+1)*sign>=.45:b+=1
              waves.append((a,b,i,sign,round(score,3)))
          waves.sort()
          fig,ax=plt.subplots(figsize=(144,40),dpi=100)
          ax.plot(closes,color='#b8c4d5',linewidth=1)
          for a,b,i,sign,score in waves:
              ax.axvspan(a,b,color='#20b486' if sign>0 else '#e05260',alpha=.12)
              ax.scatter(i,closes[i],color='#20b486' if sign>0 else '#e05260',s=60)
              ax.scatter([a,b],[closes[a],closes[b]],color='#f1b82d',s=40)
          ax.set_facecolor('#111927');fig.patch.set_facecolor('#111927')
          ax.tick_params(colors='white');ax.set_title('Exploratory wave cores | retrospective, not live signals',color='white')
          ax.set_xticks(range(0,1440,30),[f'{i//60:02d}:{i%60:02d}' for i in range(0,1440,30)])
          ax.grid(alpha=.15);fig.savefig(out/'wave-cores.png');plt.close(fig)
          (out/'wave-cores.json').write_text(json.dumps(waves))
          print('WAVE_CORES',json.dumps(waves))
          print('Verified 1440 consecutive candles; generated 25 charts')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc-24h-detailed
          path: charts/
