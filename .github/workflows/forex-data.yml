name: Forex data probe
on:
  push:
    branches: [feature/forex]
    paths: ['.github/workflows/forex-data.yml', 'tools/forex_figures.py', 'tools/ForexReplay.kt']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and validate EURUSD since 2020 M1 (FXCM)
        run: |
          mkdir -p forex-data
          python - <<'PY'
          import csv, gzip, io, json, urllib.request, urllib.error, datetime, time, collections, os
          today=datetime.datetime.now(datetime.timezone.utc).date()
          start=datetime.date(2020,1,1)
          end=today
          monday=start-datetime.timedelta(days=start.weekday())
          weeks=[]
          date=monday
          while date<=end:
              iso=date.isocalendar()
              # FXCM uses 0-indexed week files rather than ISO week numbers.
              weeks.append((date,iso.year,iso.week-1))
              date+=datetime.timedelta(days=7)
          report={'source':'FXCM public candledata', 'timeframe':'m1','pair':'EURUSD','startDate':str(start),'endDateExclusive':str(end),'weeksRequested':len(weeks),'weeksDownloaded':0,'weeksMissing':[], 'weeksFailed':[],'rowsValid':0,'rowsInvalid':0,'firstTimestamp':None,'lastTimestamp':None,'lastWeekDownloaded':None,'recentWeekFound':False,'spreadSamples':[]}
          last_ms=None
          gaps=collections.Counter()
          out=open('forex-data/eurusd-m1-all.csv','w',newline='')
          writer=csv.writer(out)
          writer.writerow(['DateTime','BidOpen','BidHigh','BidLow','BidClose','AskOpen','AskHigh','AskLow','AskClose'])
          for date,year,week in weeks:
              # DateTime is FXCM archive clock, not assumed UTC; keep raw date text.
              url=f'https://candledata.fxcorporate.com/m1/EURUSD/{year}/{week}.csv.gz'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ForexArchiveProbe/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=r.read(12_000_000)
                  lines=csv.DictReader(io.StringIO(gzip.decompress(payload).decode('utf-8-sig')))
                  rows=0
                  for r in lines:
                      try:
                          bid=[float(r[k]) for k in ('BidOpen','BidHigh','BidLow','BidClose')]
                          ask=[float(r[k]) for k in ('AskOpen','AskHigh','AskLow','AskClose')]
                          bopen,bhigh,blow,bclose=bid
                          aopen,ahigh,alow,aclose=ask
                          if not (0<blow<=min(bopen,bclose)<=max(bopen,bclose)<=bhigh and 0<alow<=min(aopen,aclose)<=max(aopen,aclose)<=ahigh and ask[3]>=bid[3]):
                              report['rowsInvalid']+=1
                              continue
                          ts=datetime.datetime.strptime(r['DateTime'],'%m/%d/%Y %H:%M:%S.%f')
                          if not (start<=ts.date()<end):continue
                          if report['firstTimestamp'] is None:report['firstTimestamp']=r['DateTime']
                          report['lastTimestamp']=r['DateTime']
                          if len(report['spreadSamples'])<4: report['spreadSamples'].append(round((ask[3]-bid[3])*10000,3))
                          writer.writerow([r['DateTime']]+[r[k] for k in ('BidOpen','BidHigh','BidLow','BidClose','AskOpen','AskHigh','AskLow','AskClose')])
                          rows+=1
                      except (KeyError,ValueError,TypeError):
                          report['rowsInvalid']+=1
                  report['rowsValid']+=rows
                  report['weeksDownloaded']+=1
                  report['lastWeekDownloaded']=str(date)
                  if date>=today-datetime.timedelta(days=14): report['recentWeekFound']=True
                  print('OK',year,week,rows,flush=True)
              except urllib.error.HTTPError as e:
                  (report['weeksMissing'] if e.code==404 else report['weeksFailed']).append({'weekStart':str(date),'year':year,'weekNumber':week,'status':e.code})
                  print('HTTP',e.code,year,week,flush=True)
              except Exception as e:
                  report['weeksFailed'].append({'weekStart':str(date),'year':year,'weekNumber':week,'error':str(e)})
                  print('ERROR',year,week,str(e),flush=True)
              if report['weeksDownloaded']%16==0 and report['weeksDownloaded']>0:out.flush()
          out.close()
          # Sort and deduplicate by actual timestamp, then split on unexpected gaps.
          src='forex-data/eurusd-m1-all.csv'
          fmt='%m/%d/%Y %H:%M:%S.%f'
          with open(src) as f:
              reader=csv.reader(f)
              header=next(reader)
              data={datetime.datetime.strptime(r[0],fmt):r for r in reader}
          stamps=sorted(data)
          # Find archive-scale uninterrupted spans. A missing minute is recorded
          # as a defect, but does not discard months of otherwise usable quotes.
          # Any >=72-hour non-weekend gap splits the span. Normal FX weekends
          # and holiday closures are tolerated, with audit statistics retained.
          segments=[]
          left=0
          gap_events=[]
          def expected_weekend(a,b):
              return (a.weekday()==4 and b.weekday() in (6,0) and
                      a.hour>=19 and b-a<=datetime.timedelta(hours=76))
          for i in range(1,len(stamps)):
              a,b=stamps[i-1],stamps[i]
              diff=b-a
              if diff<=datetime.timedelta(minutes=1):
                  continue
              weekend=expected_weekend(a,b)
              if not weekend:
                  missing_minutes=int(diff.total_seconds()/60)-1
                  gap_events.append({'from':str(a),'to':str(b),'missingMinutes':missing_minutes})
              # A genuine missing market week is an absolute boundary.
              if diff>=datetime.timedelta(hours=72) and not weekend:
                  segments.append((left,i))
                  left=i
          if stamps:
              segments.append((left,len(stamps)))
          segments.sort(key=lambda p:(stamps[p[1]-1]-stamps[p[0]],p[1]-p[0]),reverse=True)
          def describe(p):
              a,b=p
              low,high=stamps[a],stamps[b-1]
              unexpected=[g for g in gap_events if low<=datetime.datetime.fromisoformat(g['from']) and datetime.datetime.fromisoformat(g['to'])<=high]
              return {'first':str(low),'last':str(high),'candles':b-a,
                      'calendarDays':round((high-low).total_seconds()/86400,2),
                      'unexpectedGaps':len(unexpected),
                      'missingMinutesWithinSpan':sum(g['missingMinutes'] for g in unexpected)}
          report['uniqueCandles']=len(stamps)
          report['duplicates']=report['rowsValid']-len(stamps)
          report['segmentCount']=len(segments)
          report['unexpectedGapCount']=len(gap_events)
          report['largestUnexpectedGaps']=sorted(gap_events,key=lambda g:g['missingMinutes'],reverse=True)[:20]
          report['topSegments']=[describe(p) for p in segments[:20]]
          report['continuityRule']='Split only on unexpected >=72h gaps. Smaller missing-minute gaps remain documented: not a strict one-minute continuous series.'
          if segments:
              a,b=segments[0]
              with open('forex-data/eurusd-longest-contiguous.csv','w',newline='') as f:
                  w=csv.writer(f)
                  w.writerow(header)
                  w.writerows(data[t] for t in stamps[a:b])
              report['longestSegment']=describe(segments[0])
          # Export independent research segments, with explicit reset boundaries.
          selected=[]
          with open('forex-data/eurusd-research-2020-2022.csv','w',newline='') as f:
              w=csv.writer(f)
              w.writerow(['SegmentId']+header)
              for a,b in sorted(segments):
                  subset=[t for t in stamps[a:b] if 2020<=t.year<=2022]
                  if not subset: continue
                  sid=len(selected)+1
                  for t in subset: w.writerow([sid]+data[t])
                  selected.append({'segmentId':sid,'first':str(subset[0]),'last':str(subset[-1]),'candles':len(subset)})
          report['researchSegments']=selected
          report['researchCandles']=sum(x['candles'] for x in selected)
          report['backtestContract']='Reset pattern state at every SegmentId change. Exclude trades unresolved at segment end from performance and report separately. Never fabricate missing candles. Audit smaller gaps before using M1 execution.'
          report['coverageDownloadedPercent']=round(100*report['weeksDownloaded']/len(weeks),2)
          report['qualityStatus']='incomplete' if report['weeksMissing'] or report['weeksFailed'] else 'complete'
          with open('forex-data/report.json','w') as f:json.dump(report,f,indent=2)
          print('SUMMARY',json.dumps(report),flush=True)
          if not report['rowsValid']:raise SystemExit('No valid candles')
          if report['coverageDownloadedPercent']<90: print('WARNING: Coverage below 90%; dataset is incomplete. See report.json',flush=True)
          PY
      - name: Compile and replay Forex patterns
        run: |
          src=app/src/main/java/com/cryptotrader/bybit
          python -c 'import pathlib,re; s=pathlib.Path("app/src/main/java/com/cryptotrader/bybit/Models.kt").read_text(); pathlib.Path("ReplayModels.kt").write_text(re.sub(r"data class AppState\([\s\S]*?\n\)\n", "", s))'
          kotlinc "$src/SignalDetector.kt" ReplayModels.kt tools/ForexReplay.kt -include-runtime -d forex.jar
          java -Xmx5g -jar forex.jar
          python - <<'PY'
          import csv,collections,json
          groups=collections.defaultdict(lambda:[0,0,0,0.0])
          for r in csv.DictReader(open('forex-signals.csv')):
              for name in (r['pattern'],'ALL'):
                  k=(r['tf'],r['year'],name,r['horizonBars'])
                  g=groups[k]
                  if r['status']!='ok':g[2]+=1;continue
                  p=float(r['netPips']);g[0]+=1;g[1]+=p>0;g[3]+=p
          out=[dict(tf=k[0],year=k[1],pattern=k[2],horizon=k[3],valid=g[0],wins=g[1],gaps=g[2],meanPips=g[3]/max(1,g[0])) for k,g in sorted(groups.items())]
          with open('forex-data/pattern-summary.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print('FOREX SUMMARY',json.dumps(out,ensure_ascii=False))
          PY
          mv forex-signals.csv forex-data/
      - name: Detect and draw Forex chart patterns
        run: |
          python -m pip install matplotlib
          python tools/forex_figures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-fxcm-since-2020
          path: forex-data/
          compression-level: 6
