name: Forex data probe
on:
  push:
    branches: [feature/forex]
    paths: ['.github/workflows/forex-data.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe FXCM public M1 candles (EURUSD)
        run: |
          mkdir -p forex-data
          python - <<'PY'
          import csv, gzip, io, json, urllib.request, datetime, sys, traceback
          now=datetime.datetime.now(datetime.timezone.utc)
          # FXCM archives are indexed by week of year; try recent weeks and a historical reference.
          weeks=[(now.year,now.isocalendar().week-1),(now.year-1,20),(2024,20)]
          results=[]
          for year,week in weeks:
              if week<1: continue
              url=f"https://candledata.fxcorporate.com/m1/EURUSD/{year}/{week}.csv.gz"
              item={'provider':'FXCM','url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ForexDataQualityProbe/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      body=resp.read(12_000_000)
                      item['httpStatus']=resp.status
                  lines=gzip.decompress(body).decode('utf-8-sig').splitlines()
                  sample=list(csv.reader(lines[:5]))
                  item.update(status='ok',lineCount=len(lines),sample=sample)
                  print('FXCM SUCCESS',url,len(lines),sample[:2])
                  # Save all rows for one week only; avoid committing vendor data to Git.
                  with open('forex-data/eurusd-week.csv','w') as out:out.write('\n'.join(lines)+'\n')
                  results.append(item)
                  break
              except Exception as e:
                  item.update(status='failed',error=str(e))
                  print('FXCM FAILED',url,str(e))
                  results.append(item)
          with open('forex-data/source-status.json','w') as out:json.dump(results,out,indent=2)
          if not any(x['status']=='ok' for x in results):
              raise SystemExit('FXCM_ACCESS_UNAVAILABLE: no candles retrieved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-fxcm-probe
          path: forex-data/
