name: Forex data probe
on:
  push:
    branches: [feature/forex]
    paths: ['.github/workflows/forex-data.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download EURUSD minute candles
        run: |
          npm install dukascopy-node
          mkdir -p forex-data
          cat > probe.cjs <<'JS'
          const {getHistoricalRates}=require('dukascopy-node');
          const fs=require('fs');
          (async()=>{
            const now=new Date();
            const end=new Date(now); end.setUTCHours(0,0,0,0);
            const start=new Date(end); start.setUTCFullYear(start.getUTCFullYear()-3);
            const report=[];
            for(let from=new Date(start);from<end;){
              const to=new Date(from);to.setUTCMonth(to.getUTCMonth()+1);
              if(to>end)to.setTime(+end);
              const rows=await getHistoricalRates({instrument:'eurusd',dates:{from,to},timeframe:'m1',format:'json',priceType:'bid'});
              if(!Array.isArray(rows)||!rows.length)throw Error('Empty month '+from.toISOString());
              fs.writeFileSync('forex-data/'+from.toISOString().slice(0,10)+'.json',JSON.stringify(rows));
              report.push({from,to,count:rows.length,first:rows[0],last:rows.at(-1)});
              console.log(JSON.stringify(report.at(-1)));
              from=to;
            }
            const recent=await getHistoricalRates({instrument:'eurusd',dates:{from:new Date(+now-3600000),to:now},timeframe:'m1',format:'json',priceType:'bid'});
            fs.writeFileSync('forex-data/recent.json',JSON.stringify(recent));
            fs.writeFileSync('forex-data/report.json',JSON.stringify({now,report,recentCount:recent.length,recentLast:recent.at(-1)},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node probe.cjs
      - name: Validate candles
        if: always()
        run: |
          python - <<'PY'
          import glob,json,datetime
          last=None; gaps=bad=total=0; examples=[]
          for p in sorted(glob.glob('forex-data/2*.json')):
              for r in json.load(open(p)):
                  t=r['timestamp']
                  if isinstance(t,str): t=datetime.datetime.fromisoformat(t.replace('Z','+00:00')).timestamp()*1000
                  if last is not None and t-last!=60000:
                      gaps+=1
                      if len(examples)<20: examples.append([last,t,t-last])
                  last=t
                  o,h,l,c=(r[k] for k in ('open','high','low','close'))
                  bad+=int(not (0<l<=min(o,c)<=max(o,c)<=h))
                  total+=1
          result=dict(total=total,non_minute_intervals=gaps,invalid_ohlc=bad,gap_examples=examples,note='Gaps include weekends and holidays; not all are missing data.')
          print(result)
          with open('forex-data/quality.json','w') as f:json.dump(result,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-data-probe
          path: forex-data/
