name: Forex data probe
on:
  push:
    branches: [feature/forex]
    paths: ['.github/workflows/forex-data.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check alternative public Forex history sources
        run: |
          mkdir -p forex-data
          python - <<'PY'
          import urllib.request,urllib.error,json,time
          urls={
            "histdata_download_page":"https://www.histdata.com/download-free-forex-data/",
            "histdata_m1_spec":"https://www.histdata.com/f-a-q/data-files-detailed-specification/",
            "truefx_historical_page":"https://www.truefx.com/truefx-historical-downloads/",
            "oanda_practice_candles":"https://api-fxpractice.oanda.com/v3/instruments/EUR_USD/candles?granularity=M1&count=2"
          }
          results={}
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"CryptoTrader-Forex-Source-Probe/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      payload=r.read(2048)
                      results[name]={"status":r.status,"content_type":r.headers.get("Content-Type"),"bytes_sample":len(payload),"note":"Page or endpoint accessibility only; not confirmation of downloadable candles"}
              except urllib.error.HTTPError as e:
                  results[name]={"status":e.code,"note":"HTTP response without credentials (401 expected for OANDA)"}
              except Exception as e:
                  results[name]={"error":str(e)}
              print(name,results[name],flush=True)
          with open("forex-data/provider-access.json","w") as f:json.dump(results,f,indent=2)
          if not any(x.get("status")==200 for x in results.values()):
              raise SystemExit("No public provider page accessible")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-source-access
          path: forex-data/
