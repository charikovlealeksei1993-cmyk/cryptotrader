name: Android debug APK
on:
  push:
    branches: [feature/trap-signals-v14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        run: bash gradlew --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoTrader-v14-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  emulator:
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: CryptoTrader-v14-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p diagnostics
            adb install apk/app-debug.apk
            adb shell pm grant com.cryptotrader.bybit android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -W -n com.cryptotrader.bybit/.MainActivity
            sleep 30
            adb shell pidof com.cryptotrader.bybit
            adb exec-out screencap -p > diagnostics/main.png
            adb logcat -d > diagnostics/logcat.txt
            adb shell dumpsys activity activities > diagnostics/activities.txt
            if grep -A 3 'FATAL EXCEPTION' diagnostics/logcat.txt | grep -q 'Process: com.cryptotrader.bybit'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-diagnostics
          path: diagnostics/
          retention-days: 14
