name: Historical signal replay
on:
  push:
    branches: [feature/trap-signals-v14]
    paths:
      - 'tools/SignalReplay.kt'
      - 'tools/parameter_sweep.py'
      - 'tools/download_signal_history.py'
      - '.github/workflows/signal-history.yml'
      - 'app/src/main/java/com/cryptotrader/bybit/SignalDetector.kt'
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Minutes separated by spaces (1 5 15 30 60)'
        default: '1 5 15 30 60'
        type: string
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile actual detector
        run: |
          src=app/src/main/java/com/cryptotrader/bybit
          # AppState is unrelated to the detector and references Android UI models.
          python -c 'import pathlib,re; s=pathlib.Path("app/src/main/java/com/cryptotrader/bybit/Models.kt").read_text(); pathlib.Path("ReplayModels.kt").write_text(re.sub(r"data class AppState\([\s\S]*?\n\)\n", "", s))'
          kotlinc "$src/SignalDetector.kt" ReplayModels.kt tools/SignalReplay.kt -include-runtime -d replay.jar
      - name: Restore prepared history
        id: history
        uses: actions/cache@v4
        with:
          path: replay-input.csv
          key: btcusdt-history-v1-${{ hashFiles('tools/download_signal_history.py') }}
      - name: Download historical trades
        if: steps.history.outputs.cache-hit != 'true'
        run: python tools/download_signal_history.py
      - name: Validate history
        run: |
          python -c 'import csv; csv.field_size_limit(10000000); f=open("replay-input.csv"); rows=csv.reader(f); start=1791590400000; n=0; exec("for r in rows:\n assert int(r[0]) == start+n*60000 and len(r)==8\n n+=1"); assert n==44*1440, n'
      - name: Replay signals
        env:
          TIMEFRAMES: ${{ inputs.timeframes || '1 5 15 30 60' }}
        run: |
          read -r -a frames <<< "$TIMEFRAMES"
          java -jar replay.jar "${frames[@]}"
          cat signal-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Sweep application SL/TP presets
        run: |
          python tools/parameter_sweep.py
          echo "SL/TP sweep saved in parameter-sweep.csv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-signal-results
          path: |
            signal-results.csv
            signal-summary.txt
            parameter-sweep.csv
