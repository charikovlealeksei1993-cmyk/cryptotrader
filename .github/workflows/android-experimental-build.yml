name: Android experimental build

on:
  push:
    branches:
      - feature/trap-signals-v14
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compile experimental debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon
